mqtt:
  enabled: false
  host: "127.0.0.1"
  port: 1883
  username: ""
  password: ""
  topics:
    control: "brennofen/control"
    temperature: "brennofen/temperature"
    relay_status: "brennofen/relay_status"

debug_mode: true

temperature_sensor:
  class: real_temperature_sensor.RealTemperatureSensor

relay_switch:
  class: real_relay_switch.RealRelaySwitch

programm: glasurbrand 

programme:
  schruehbrand:
    brennkurve:
      - phase: vorlaufzeit
        duration_minutes: 0

      - phase: aufheizen
        target_temp: 400
        duration_minutes: 120

      - phase: haltezeit
        duration_minutes: 60

      - phase: aufheizen
        target_temp: 950
        duration_minutes: 180

      - phase: haltezeit
        duration_minutes: 60

      - phase: abkuehlen
        cooldown_rate_c_per_h: 350
  
  glasurbrand:
    brennkurve:
      - phase: vorlaufzeit
        duration_minutes: 0

      - phase: aufheizen
        target_temp: 550
        duration_minutes: 120
        wait_until_reached: true

      - phase: haltezeit
        duration_minutes: 15

      - phase: aufheizen
        target_temp: 1162
        duration_minutes: 400
        wait_until_reached: true

      - phase: aufheizen
        target_temp: 1164
        duration_minutes: 20

      - phase: haltezeit
        duration_minutes: 20

      - phase: abkuehlen
        cooldown_rate_c_per_h: 350
